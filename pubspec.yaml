name: suska_starter
description: Kerangka aplikasi Flutter UIN Sultan Syarif Kasim Riau - PTIPD
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  bloc: ^9.2.1
  dio: ^5.11.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  google_fonts: ^8.2.1
  # v6 (SDK legacy Play Services Auth) — v7/Credential Manager menyamarkan
  # client yang belum terdaftar sebagai "[16] Account reauth failed".
  # JANGAN upgrade tanpa menguji login di emulator DAN perangkat fisik.
  google_sign_in: ^6.3.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
